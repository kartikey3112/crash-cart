# CrashCart CI: test the store, publish the results dashboard.
# Jobs are added step by step (Phase 8); this file currently defines only when and how
# the workflow runs.
name: CrashCart tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"  # docs-only commits don't need a test run
  schedule:
    - cron: "7 21 * * *"  # 21:07 UTC = 02:37 IST, nightly (off the hour, see notes)
  workflow_dispatch:
    inputs:
      suites:
        description: "Live suites to run (comma-separated): api, ui, perf"
        type: string
        default: "api,ui,perf"
      bugs:
        description: "Bug switches to enable, comma-separated (empty = none)"
        type: string
        default: ""
      browsers:
        description: "UI browsers (comma-separated): chromium, firefox, webkit"
        type: string
        default: "chromium"

# One run at a time. A new run waits instead of cancelling the one in progress, so two runs
# never push to results-data together or reset the shared store under each other.
concurrency:
  group: crashcart-ci
  cancel-in-progress: false

# Least privilege by default; jobs that publish ask for more themselves.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"
  FORCE_COLOR: "1"

jobs:
  # ---------------------------------------------------------------------------------------
  # self-test: everything that needs no deployed site. Runs on every trigger.
  # Results that go on the dashboard: backend unit tests, the API suite against a backend
  # started inside the runner (its own "API (in-runner)" group, never mixed with live API
  # results), test catalogs and combined unit + API coverage.
  # ---------------------------------------------------------------------------------------
  self-test:
    name: Self-test (lint, build, unit, coverage, pipeline, dashboard)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      # The publish job deploys the dashboard only if its own tests passed.
      dashboard_ok: ${{ steps.dashboard-tests.outcome == 'success' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            store/backend/requirements*.txt
            tests/requirements.txt
            pipeline/requirements.txt

      - name: Install Python dependencies
        run: >
          pip install -r store/backend/requirements-dev.txt
          -r tests/requirements.txt -r pipeline/requirements.txt

      - name: Lint (ruff)
        run: |
          ruff check . store/backend
          ruff format --check . store/backend

      - name: Lint the workflow itself (actionlint + shellcheck)
        run: |
          base=https://github.com/rhysd/actionlint/releases/download/v1.7.12
          curl -sSfL -o actionlint.tgz "$base/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -sSfL "$base/actionlint_1.7.12_checksums.txt" | grep linux_amd64.tar.gz \
            | sed 's/actionlint_1.7.12_linux_amd64.tar.gz/actionlint.tgz/' | sha256sum -c -
          tar -xzf actionlint.tgz actionlint && rm actionlint.tgz
          # Also runs ShellCheck on every run: script (ShellCheck ships with GitHub's runners).
          ./actionlint -color
          rm actionlint

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: store/frontend/package-lock.json

      - name: Type-check and build the frontend
        working-directory: store/frontend
        run: |
          npm ci
          npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tests/requirements.txt') }}

      - name: Install Chromium for the dashboard tests
        run: python -m playwright install --with-deps chromium

      - name: Write test catalogs (every system test + every unit test)
        run: |
          mkdir -p raw/junit raw/catalog raw/allure-results selftest
          pytest tests --collect-only -q --catalog-out=raw/catalog/catalog-system.json
          cd store/backend
          pytest --collect-only -q -p no:cacheprovider --catalog-out=../../raw/catalog/catalog-unit.json

      - name: Backend unit tests (with coverage)
        working-directory: store/backend
        env:
          COVERAGE_FILE: .coverage.unit
        run: >
          pytest -p no:cacheprovider --cov --cov-report=
          --junitxml=../../raw/junit/junit-unit.xml --alluredir=../../raw/allure-results

      # Throwaway values for the in-runner backend only (never the production secrets).
      # Scoped to these steps so the unit tests above see a clean environment.
      - name: Start the backend under coverage
        if: ${{ !cancelled() }}
        working-directory: store/backend
        env:
          CRASHCART_DATABASE_URL: sqlite:///./ci.db
          CRASHCART_TEST_TOKEN: ci-test-token
          CRASHCART_ADMIN_PASSWORD: ci-admin-password
        run: |
          coverage run --data-file=.coverage.api -m uvicorn app.main:app --port 8000 &
          echo $! > uvicorn.pid
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          echo "backend did not start"; exit 1

      - name: API suite against the in-runner backend
        if: ${{ !cancelled() }}
        env:
          API_BASE_URL: http://127.0.0.1:8000
          TEST_TOKEN: ci-test-token
          ADMIN_PASSWORD: ci-admin-password
        # Published as its own "API (in-runner)" group; the file name tells the pipeline so.
        run: >
          pytest tests/api -n 4 --junitxml=raw/junit/junit-api-local.xml
          --alluredir=raw/allure-results

      - name: Stop the backend and combine coverage (unit + API)
        if: ${{ !cancelled() }}
        working-directory: store/backend
        run: |
          kill -INT "$(cat uvicorn.pid)"   # graceful stop so coverage saves its data
          for _ in $(seq 1 15); do kill -0 "$(cat uvicorn.pid)" 2>/dev/null || break; sleep 1; done
          coverage combine --keep .coverage.unit .coverage.api
          coverage json -o ../../raw/coverage.json
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Pipeline tests
        if: ${{ !cancelled() }}
        run: pytest pipeline/tests --junitxml=selftest/junit-pipeline.xml

      - name: Dashboard tests
        id: dashboard-tests
        if: ${{ !cancelled() }}
        run: pytest dashboard/tests --junitxml=selftest/junit-dashboard.xml

      - name: Upload results for the dashboard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: raw-self-test
          path: raw/
          retention-days: 7

      - name: Upload self-test reports (for debugging)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: self-test-reports
          path: |
            selftest/
            test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------------------
  # Live tests against the DEPLOYED store, in sequence: plan -> prepare -> API -> UI -> perf.
  # Sequential on purpose: API admin tests create products, which would shift the pages the
  # UI pagination test compares; perf runs last so other suites' traffic can't skew it.
  # Each suite job runs even if the previous suite failed, so results are always collected.
  # ---------------------------------------------------------------------------------------
  plan:
    name: Plan the live run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      live: ${{ steps.plan.outputs.live }}
      run_api: ${{ steps.plan.outputs.run_api }}
      run_ui: ${{ steps.plan.outputs.run_ui }}
      run_perf: ${{ steps.plan.outputs.run_perf }}
      browsers: ${{ steps.plan.outputs.browsers }}
      bugs: ${{ steps.plan.outputs.bugs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Decide suites, browsers and bug switches
        id: plan
        env:
          # Only true/false is exposed here, never the URLs themselves.
          HAS_URLS: ${{ secrets.STORE_API_URL != '' && secrets.STORE_UI_URL != '' }}
          SUITES: ${{ inputs.suites }}
          BROWSERS: ${{ inputs.browsers }}
          BUGS: ${{ inputs.bugs }}
        run: >
          python -m pipeline.ci_plan --event "${{ github.event_name }}" --has-urls "$HAS_URLS"
          --suites "$SUITES" --browsers "$BROWSERS" --bugs "$BUGS"

  prepare:
    name: Wake and reset the deployed store
    needs: plan
    if: needs.plan.outputs.live == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Wait for the deploy, then reset the data
        env:
          STORE_API_URL: ${{ secrets.STORE_API_URL }}
          STORE_UI_URL: ${{ secrets.STORE_UI_URL }}
          TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
          # After a push, wait until Render and Vercel both serve the pushed commit.
          EXPECT_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: >
          python -m pipeline.ci_wait --api "$STORE_API_URL" --ui "$STORE_UI_URL"
          --token "$TEST_TOKEN" --expect-commit "$EXPECT_COMMIT"

  live-api:
    name: Live API suite
    needs: [plan, prepare]
    if: always() && needs.prepare.result == 'success' && needs.plan.outputs.run_api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_BASE_URL: ${{ secrets.STORE_API_URL }}
      UI_BASE_URL: ${{ secrets.STORE_UI_URL }}
      TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ENABLE_BUGS: ${{ needs.plan.outputs.bugs }}
      RESET_BEFORE_RUN: "false"  # the prepare job already reset the store once
      WAKE_TIMEOUT_S: "180"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: Run the API suite
        run: >
          pytest tests/api -n 4 --junitxml=raw/junit/junit-api.xml
          --alluredir=raw/allure-results
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: raw-live-api
          path: raw/
          retention-days: 7

  live-ui:
    name: Live UI suite (${{ matrix.browser }})
    needs: [plan, prepare, live-api]
    if: always() && needs.prepare.result == 'success' && needs.plan.outputs.run_ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1  # one browser at a time: UI admin tests also create products
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    env:
      API_BASE_URL: ${{ secrets.STORE_API_URL }}
      UI_BASE_URL: ${{ secrets.STORE_UI_URL }}
      TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ENABLE_BUGS: ${{ needs.plan.outputs.bugs }}
      RESET_BEFORE_RUN: "false"  # the prepare job already reset the store once
      WAKE_TIMEOUT_S: "180"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('tests/requirements.txt') }}
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run the UI suite (one retry; pass-on-retry is reported as flaky)
        run: >
          pytest tests/ui --browser ${{ matrix.browser }} --reruns 1
          --output=raw/test-results --junitxml=raw/junit/junit-ui-${{ matrix.browser }}.xml
          --alluredir=raw/allure-results
      - name: Upload results, traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: raw-live-ui-${{ matrix.browser }}
          path: raw/
          retention-days: 7

  live-perf:
    name: Live perf suite (JMeter)
    needs: [plan, prepare, live-api, live-ui]
    if: always() && needs.prepare.result == 'success' && needs.plan.outputs.run_perf == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_BASE_URL: ${{ secrets.STORE_API_URL }}
      UI_BASE_URL: ${{ secrets.STORE_UI_URL }}
      TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ENABLE_BUGS: ${{ needs.plan.outputs.bugs }}
      RESET_BEFORE_RUN: "false"  # the prepare job already reset the store once
      WAKE_TIMEOUT_S: "180"
      JMETER_HOME: ${{ github.workspace }}/.tools/apache-jmeter-5.6.3
      PERF_RESULTS_DIR: raw/perf
      # Load profile and budgets: repository variables, with the agreed defaults.
      PERF_USERS: ${{ vars.PERF_USERS || '10' }}
      PERF_DURATION_S: ${{ vars.PERF_DURATION_S || '60' }}
      PERF_P95_MS_PRODUCTS_LIST: ${{ vars.PERF_P95_MS_PRODUCTS_LIST || '800' }}
      PERF_P95_MS_PRODUCT_SEARCH: ${{ vars.PERF_P95_MS_PRODUCT_SEARCH || '800' }}
      PERF_P95_MS_PRODUCT_DETAIL: ${{ vars.PERF_P95_MS_PRODUCT_DETAIL || '800' }}
      PERF_P95_MS_CART_READ: ${{ vars.PERF_P95_MS_CART_READ || '800' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache JMeter
        id: jmeter-cache
        uses: actions/cache@v6
        with:
          path: .tools/apache-jmeter-5.6.3
          key: jmeter-5.6.3
      - name: Download JMeter 5.6.3 and verify its SHA-512
        if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools && cd .tools
          base=https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3  # keeps every version
          curl -sSfL -o jmeter.tgz "$base.tgz"
          echo "$(curl -sSfL "$base.tgz.sha512" | cut -d' ' -f1)  jmeter.tgz" | sha512sum -c -
          tar -xzf jmeter.tgz && rm jmeter.tgz
      - name: Run the perf suite
        run: pytest tests/perf --junitxml=raw/junit/junit-perf.xml --alluredir=raw/allure-results
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: raw-live-perf
          path: raw/
          retention-days: 7

  # ---------------------------------------------------------------------------------------
  # publish: turn this run's raw results into dashboard data, keep the history on the
  # results-data branch, and prepare the site for Pages. Runs even when tests failed.
  # ---------------------------------------------------------------------------------------
  publish:
    name: Build dashboard data
    needs: [self-test, plan, prepare, live-api, live-ui, live-perf]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write  # force-push the results-data branch
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DASHBOARD_URL: https://kartikey3112.github.io/crash-cart/
      ALLURE_CMD: ${{ github.workspace }}/.tools/allure-2.46.1/bin/allure
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - uses: actions/setup-java@v6  # the Allure CLI runs on Java
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache the Allure CLI
        id: allure-cache
        uses: actions/cache@v6
        with:
          path: .tools/allure-2.46.1
          key: allure-2.46.1
      - name: Download Allure 2.46.1 from Maven Central and verify its SHA-512
        if: steps.allure-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools && cd .tools
          base=https://repo1.maven.org/maven2/io/qameta/allure/allure-commandline/2.46.1/allure-commandline-2.46.1.zip
          curl -sSfL -o allure.zip "$base"
          echo "$(curl -sSfL "$base.sha512" | cut -d' ' -f1)  allure.zip" | sha512sum -c -
          unzip -q allure.zip && rm allure.zip

      - name: Collect every job's raw results into one folder
        uses: actions/download-artifact@v8
        with:
          pattern: raw-*
          path: raw
          merge-multiple: true  # junit/, perf/, allure-results/ ... from all jobs together

      - name: Fetch the result history (data/ and reports/) from the results-data branch
        run: |
          mkdir -p site
          if git fetch --depth 1 origin results-data; then
            git archive FETCH_HEAD | tar -x -C site
            echo "Loaded history: $(find site/data/runs -name "*.json" | wc -l) files"
          else
            echo "No results-data branch yet: starting a new history"
          fi

      - name: Build dashboard data, downloads and retention (newest 30 runs keep reports)
        env:
          BUGS: ${{ needs.plan.outputs.bugs }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          python -m pipeline.build --raw raw --site site --run-id "$RUN_ID"
          --sha "${{ github.sha }}" --branch "${{ github.ref_name }}"
          --trigger "${{ github.event_name }}" --bugs "$BUGS"
          --workflow-url "$WORKFLOW_URL" --dashboard-url "$DASHBOARD_URL" --keep 30

      - name: Save the history to results-data (one fresh commit, so it never grows)
        run: |
          # 1. Commit data/ + reports/ as a single parentless commit in a scratch repo.
          mkdir history && cp -r site/data site/reports history/
          git -C history init -q -b results-data
          git -C history add -A
          git -C history -c user.name="crashcart-ci" \
            -c user.email="crashcart-ci@users.noreply.github.com" \
            commit -q -m "Results after run $RUN_ID (${{ github.sha }})"
          # 2. Bring that commit into the main checkout and force-push it from there,
          #    using the credentials actions/checkout already set up.
          git fetch -q ./history results-data:refs/heads/ci-results-data
          git push --force -q origin refs/heads/ci-results-data:refs/heads/results-data
          echo "results-data now holds $(git ls-tree -r --name-only ci-results-data | wc -l) files"

      - name: Add the dashboard pages to the site
        run: python -m pipeline.assemble --site site

      - name: Stop here if the dashboard's own tests failed (results are already saved)
        if: needs.self-test.outputs.dashboard_ok != 'true'
        run: |
          echo "::error::Dashboard tests failed or didn't run, so the dashboard is not deployed."
          exit 1

      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy dashboard to GitHub Pages
    needs: publish  # runs only if publish succeeded (incl. the dashboard-test gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write  # deploy-pages proves its identity to Pages with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

; System tests (tests/). Backend unit tests have their own config in store/backend.
[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers -p no:cacheprovider
xfail_strict = true
markers =
    api: API-layer test (httpx against the running backend)
    ui: UI-layer test (Playwright against the running frontend)
    perf: performance test (JMeter, p95 threshold)
    feature(name): store feature area the test covers
    bug(name): bug switch this test is designed to catch
